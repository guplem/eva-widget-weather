<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather</title>
    <!-- Eva answers this path with her colours. The widget works without it too. -->
    <link rel="stylesheet" href="eva/theme.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main class="widget" data-size="medium" data-state="loading">
      <section class="now" data-role="now" aria-live="polite">
        <div class="now-main">
          <span class="now-icon" data-role="now-icon"></span>
          <span class="now-temperature" data-role="now-temperature"></span>
        </div>
        <div class="now-text">
          <p class="now-sky" data-role="now-sky"></p>
          <p class="now-range" data-role="now-range"></p>
        </div>
      </section>
      <dl class="details" data-role="details"></dl>
      <ol class="hours" data-role="hours" aria-label="The next hours"></ol>
      <ol class="days" data-role="days" aria-label="The next days"></ol>
      <p class="message" data-role="message"></p>
      <footer class="widget-footer">
        <p class="place" data-role="place"></p>
        <a class="credit" href="https://open-meteo.com/" target="_blank" rel="noopener">Weather data by Open-Meteo</a>
      </footer>
    </main>
  </body>
</html>
